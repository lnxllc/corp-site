<script>
// お問い合わせフォーム → GAS(スプレッドシート)送信
(function(){
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbw0or8jZLXeW_LpvchfWFFPoYUU6_8bYURq-wfvP2JuOFb0AJdl33Xz4DmsWwI0ZBxH/exec';
  var form = document.getElementById('contactForm');
  if(!form) return;
  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(!form.checkValidity()){ form.reportValidity(); return; }
    var btn = document.getElementById('contactSubmit');
    var status = document.getElementById('contactStatus');
    var checked = form.querySelector('input[name="inquiry_type"]:checked');
    var data = new URLSearchParams({
      form_type: 'contact',
      name: form.querySelector('#name').value.trim(),
      email: form.querySelector('#email').value.trim(),
      inquiry_type: checked ? checked.value : '',
      message: form.querySelector('#message').value.trim(),
      website: document.getElementById('hp-website').value
    });
    btn.disabled = true;
    btn.textContent = '送信中…';
    fetch(GAS_URL, {method:'POST', mode:'no-cors', body:data})
      .then(function(){
        btn.textContent = '送信済み ✓';
        status.style.color = '#16a34a';
        status.textContent = 'お問い合わせを受け付けました。担当より折り返しご連絡いたします。';
        status.style.display = 'block';
        window.dataLayer = window.dataLayer || [];
        dataLayer.push({
          'event': 'contact_form_submit',
          'form_name': 'contact_form',
          'inquiry_type': checked ? checked.value : ''
        });
      })
      .catch(function(){
        btn.disabled = false;
        btn.textContent = '送信する';
        status.style.color = '#dc2626';
        status.textContent = '送信に失敗しました。通信環境をご確認のうえ、もう一度お試しください。';
        status.style.display = 'block';
      });
  });
})();
</script>
